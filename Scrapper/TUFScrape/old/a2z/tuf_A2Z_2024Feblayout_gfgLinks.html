    <button onclick="scrapeTable()">Scrape Table</button>

<script>
    
    const sleep = ms => new Promise(res => setTimeout(res, ms));
    
    const LINK_MATCHERS = {
        leetCodeLink: ["leetcode"],
        ytLink: ["youtu"],
        gfgLink: ["geeksforgeeks", "practice.geeksforgeeks", "gfg", "bit.ly"]
    };

    function classifyLinks(anchors) {
        const result = {
            leetCodeLink: [],
            ytLink: [],
            gfgLink: []
        };

        anchors.forEach(href => {
            const link = href.toLowerCase();

            for (const [key, keywords] of Object.entries(LINK_MATCHERS)) {
                if (keywords.some(k => link.includes(k))) {
                    result[key].push(href);
                }
            }
        });

        return result;
    }

    async function scrapeTable() {
        const rows = document.querySelectorAll("table tbody tr");
        const problems = [];

        for (let i = 0; i < rows.length; i++) {
            const row = rows[i];

            if (!row.querySelector("input[type='checkbox']")) continue;

            const cells = [...row.children];
            const problemName = cells[1]?.textContent.trim() ?? "";

            const anchors = [...row.querySelectorAll("a")]
                .map(a => a.href)
                .filter(Boolean);

            const links = classifyLinks(anchors);

            console.log(`⏳ ${i + 1}/${rows.length} → ${problemName}`);

            problems.push({
                problemName,
                ...links
            });

            await sleep(50);
        }

        console.log("✅ Done scraping!");
        const json = JSON.stringify(problems, null, 2);
        console.log(json);

        // Copy to clipboard (Chrome devtools)
        if (typeof copy === "function") copy(json);

        // Download JSON
        const blob = new Blob([json], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "problems.json";
        a.click();

        return problems;
    }
